# Copyright © Josep Bigorra <jjbigorra@gmail.com>
#
# What this pipeline can check without a test suite is that every module still
# compiles and loads: the launcher answers `--help` from a text file and never
# reaches Guile, so loading `(skapa main)` is the check that fails when a file
# stops compiling.  Guile, guile-json and scriba are what the modules need, and
# scriba is pure Scheme, so the tarball is enough - the same release the
# container image unpacks.

name: CI

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  modules:
    name: the modules still load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Guile and guile-json
        run: |
          sudo apt-get update
          sudo apt-get install --yes guile-3.0 guile-json

      - name: Unpack scriba
        run: |
          mkdir -p "$RUNNER_TEMP/scriba"
          curl --silent --show-error --location \
            https://codeberg.org/jjba23/scriba/archive/v0.4.1.tar.gz |
            tar xz -C "$RUNNER_TEMP/scriba" --strip-components=1

      - name: Load every module from the checkout
        run: |
          guile -L "$RUNNER_TEMP/scriba/src" -L src \
            -c '(use-modules (skapa main))'
