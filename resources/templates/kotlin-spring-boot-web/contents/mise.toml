[tools]
# day to day work
java = "25"
just = "latest"
github-cli = "latest"

# linters
prek = { version = "latest", postinstall = "prek install" }
ktlint = "latest"
shellcheck = "latest"
yamlfmt = "latest"
zizmor = "latest"

# developer environment
devspace = "latest"
helm = "latest"
kubectl = "latest"
krew = { version = "latest", postinstall = "krew install oidc-login" }
yq = "latest"

[env]
_.path = "~/.krew/bin"
DEVSPACE_FLAGS = "--kube-context {{ env.VDB_DEV_KUBECONTEXT | default(value='') }} --namespace {{ env.VDB_DEV_NAMESPACE | default(value='') }}"
VDB_DEV_KUBECONTEXT = { required = true }
VDB_DEV_NAMESPACE = { required = true }
