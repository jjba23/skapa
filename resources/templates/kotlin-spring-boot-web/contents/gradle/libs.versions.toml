[versions]
fabrikt = "1.37.2"
gradle-plugin-version-catalog-update-version = "1.1.0"
kotest = "6.2.1"
kotlin = "2.3.21"
kotlin-logging = "8.0.4"
spring-doc = "3.0.3"
ktlint = "14.2.0"
logstash-logback-encoder = "9.0"
sendgrid = "4.10.3"
spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"
jackson-kotlin = "3.2.0"
mockito-kotlin = "6.3.0"
mockito-core = "5.14.0"
opentelemetry-micrometer = "2.27.0-alpha"
opentelemetry-instrumentation-annotations = "2.28.1"
opentelemetry-sdk-testing = "1.63.0"

[libraries]
# HTTP Server / Spring Boot Starters
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "spring-doc" }

# Logging
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }

# Kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor" }

# Serialization
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson-kotlin" }

# Security
spring-security-web = { module = "org.springframework.security:spring-security-web" }
spring-security-config = { module = "org.springframework.security:spring-security-config" }

# Metrics
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
spring-boot-restclient-test = { module = "org.springframework.boot:spring-boot-starter-restclient-test" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
opentelemetry = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-micrometer = { module = "io.opentelemetry.instrumentation:opentelemetry-micrometer-1.5", version.ref = "opentelemetry-micrometer" }
opentelemetry-instrumentation-annotations = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations", version.ref = "opentelemetry-instrumentation-annotations" }

# Mail
sendgrid = { module = "com.sendgrid:sendgrid-java", version.ref = "sendgrid" }

# Testing
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-webtestclient = { module = "org.springframework.boot:spring-boot-webtestclient" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito-core" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry-sdk-testing" }

# Kotest
kotest-bom = { module = "io.kotest:kotest-bom", version.ref = "kotest" }
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring" }

[bundles]
kotest = [
    "kotest-assertions-core",
    "kotest-extensions-spring",
    "kotest-framework-engine",
    "kotest-runner-junit5",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
kotest = { id = "io.kotest", version.ref = "kotest" }
fabrikt = { id = "ch.acanda.gradle.fabrikt", version.ref = "fabrikt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
jacoco = { id = "org.gradle.jacoco" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "gradle-plugin-version-catalog-update-version" }
